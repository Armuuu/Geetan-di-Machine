<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-brands/css/uicons-brands.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
  <title>Geetan di machine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background: #0a0a0a; }

  /* ---------- Background ---------- */
  .bg {
    position: fixed; inset: 0;
    background-image: url("bg.png");
    background-size: cover;
    background-position: center 100%;
  }
  .bg-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 35%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- Top right icons ---------- */
  .top-icons {
    position: fixed;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 0px;
    z-index: 10;
  }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  .icon-btn i {
    width: 35px;
    height: 35px;
    color: #FFF;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Bottom pill control panel (liquid glass) ---------- */
  .panel {
    position: fixed;
    left: 50%;
    bottom: 3vh;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 420px;
    z-index: 10;
  }

  .panel-pill {
    position: relative;
    display: flex;
    align-items: center;
    height: 108px;
    border-radius: 1000px;
    padding: 0 16px 0 96px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);   
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.4),
      inset 0 1px 1px rgba(255, 255, 255, 0.5),
      inset 0 -1px 1px rgba(255, 255, 255, 0.05);
  }

    

  /* Album art circle */
  .album-art {
    position: absolute;
    left: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 55px;
    height: 55px;
    border: 1px solid #000;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
    background: #111;
    color: #FFF;
  }
  /* Ye wrapper rotate hoga (CD spin ke liye), separate rakha h taaki
     album-art ka apna translateY(-50%) transform disturb na ho */
  .art-spin {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
  }
  .art-spin img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
    /* YouTube thumbnails me kabhi kabhi upar/niche black padding baked hoti h,
       thoda zoom karke crop kar dete h taaki wo black space na dikhe */
    transform: scale(1.4);
  }

  /* Text + progress column */
  .info-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding-right: 14px;
  }
  .track-name {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }
  .track-artist {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: -3px;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 4px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.28);
    cursor: pointer;
    margin-top: 2px;
  }
  .progress-fill {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.92);
  }

  /* Controls: prev / play / next */
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .ctrl-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* forward/backward = white */
  .ctrl-btn i {
    color: #fff;
    font-size: 15px;
  }

  .play-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 1);
  }
  /* play/pause icon = black (white circle ke upar) */
  .play-btn i {
    color: #000;
    font-size: 19px;
  }
  .play-btn #play { margin-left: 2px; } /* play triangle ko optically center karta h */

  /* Hide the actual YouTube iframe */
  #yt-player { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; bottom: 0; right: 0; }

  @media (max-width: 360px) {
    .panel-pill { height: 98px; padding-left: 88px; }
    .album-art { width: 80px; height: 80px; }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="bg-overlay"></div>
  <div class="top-icons">
    <!--
    <a href="#" class="icon-btn" aria-label="Document" title="Document">
      <i class="fi fi-rr-document"></i>
    </a>
    -->
    <a href="https://discord.com/users/1260618413651263521" class="icon-btn" aria-label="Discord" title="Discord">
      <i class="fi fi-brands-discord" style=""></i>
    </a>
    <a href="https://www.instagram.com/ig._.arman7?igsh=MXY5NTcyaG00MmlnZw==" class="icon-btn" aria-label="Instagram" title="Instagram">
      <i class="fi fi-brands-instagram"></i>
    </a>
  </div>

  <div class="panel">
    <div class="panel-pill">
      <div class="album-art">
        <div class="art-spin" id="art-spin">
          <img id="cd-art" src="" alt="Album art" />
        </div>
      </div>

      <div class="info-col">
        <div class="track-name" id="track-name">Loading…</div>
        <div class="track-artist" id="track-artist">&nbsp;</div>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prev-btn" aria-label="Previous">
          <i class="fi fi-br-step-backward"></i>
        </button>
        <button class="ctrl-btn play-btn" id="play-btn" aria-label="Play">
          <i id="play" class="fi fi-sr-play"></i>
          <i id="pause" class="fi fi-br-pause" style="display: none;"></i>
        </button>
        <button class="ctrl-btn" id="next-btn" aria-label="Next">
           <i class="fi fi-br-step-forward"></i>
        </button>
      </div>
    </div>
  </div>

  <div id="yt-player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const PLAYLIST_ID = "PLC8E8Q6GQvQI";

    let player = null;
    let progressTimer = null;

    const cdArt = document.getElementById("cd-art");
    const artSpin = document.getElementById("art-spin");
    const trackNameEl = document.getElementById("track-name");
    const trackArtistEl = document.getElementById("track-artist");
    const playBtn = document.getElementById("play-btn");
    const playIcon = document.getElementById("play");   // FIX: pehle "play-icon" dhoondh raha tha jo exist hi nahi karta tha
    const pauseIcon = document.getElementById("pause"); // FIX: same yahan
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");

    /* ---------- CD spin (rotation freeze on pause) ---------- */
    let rotateDeg = 0;
    let isSpinning = false;
    let lastTs = null;

    function spinLoop(ts) {
      if (!isSpinning) { lastTs = null; return; }
      if (lastTs !== null) {
        const dt = ts - lastTs;
        rotateDeg += dt * (360 / 9000); // 9 second me 1 full rotation
      }
      lastTs = ts;
      artSpin.style.transform = `rotate(${rotateDeg}deg)`;
      requestAnimationFrame(spinLoop);
    }
    function startSpin() {
      if (isSpinning) return;
      isSpinning = true;
      lastTs = null;
      requestAnimationFrame(spinLoop);
    }
    function stopSpin() {
      // isSpinning false karte hi loop apne aap ruk jayega, jis angle pe tha wahi freeze rahega
      isSpinning = false;
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("yt-player", {
        height: "1",
        width: "1",
        playerVars: {
          listType: "playlist",
          list: PLAYLIST_ID,
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          modestbranding: 1,
          playsinline: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      player.setShuffle(true);
      player.setLoop(true);
      updateNowPlaying();
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.BUFFERING) {
        // FIX: song change hote hi (next/prev) yahi pehla reliable point h
        // jaha naya video ka data mil jata h — isliye yahin update kar dete h
        updateNowPlaying();
      } else if (e.data === YT.PlayerState.PLAYING) {
        setPlayingUI(true);
        updateNowPlaying();
      } else if (e.data === YT.PlayerState.PAUSED) {
        setPlayingUI(false);
      } else if (e.data === YT.PlayerState.CUED) {
        updateNowPlaying();
      }
    }

    function updateNowPlaying() {
      if (!player) return;

      // FIX: getVideoData() kabhi kabhi thumbnail ke liye late/stale hota h,
      // isliye actual playlist + current index se video id nikalte h — ye zyada reliable h
      if (player.getPlaylist && player.getPlaylistIndex) {
        const list = player.getPlaylist();
        const idx = player.getPlaylistIndex();
        if (list && list.length && idx > -1 && list[idx]) {
          cdArt.src = `https://img.youtube.com/vi/${list[idx]}/hqdefault.jpg`;
        }
      }

      if (player.getVideoData) {
        const data = player.getVideoData();
        if (data) {
          trackNameEl.textContent = data.title || "Karan Aujla";
          trackArtistEl.textContent = data.author || "\u00A0";
        }
      }

      progressFill.style.width = "0%";
    }

    function setPlayingUI(playing) {
      playIcon.style.display = playing ? "none" : "block";
      pauseIcon.style.display = playing ? "block" : "none";
      if (playing) {
        startProgressLoop();
        startSpin();
      } else {
        stopProgressLoop();
        stopSpin();
      }
    }

    function togglePlay() {
      if (!player || typeof player.getPlayerState !== "function") return;
      player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
    }

    function playNext() {
      player.nextVideo();
    }

    function playPrev() {
      // FIX: pehle "3 second se zyada ho to restart" wala logic tha,
      // ab seedha previous video pe jayega, ek hi click me
      player.previousVideo();
    }

    function startProgressLoop() {
      stopProgressLoop();
      progressTimer = setInterval(() => {
        if (!player || !player.getDuration) return;
        const duration = player.getDuration();
        const current = player.getCurrentTime();
        if (duration > 0) {
          const pct = (current / duration) * 100;
          progressFill.style.width = pct + "%";
        }
      }, 250);
    }

    function stopProgressLoop() { if (progressTimer) clearInterval(progressTimer); }

    function seekFromEvent(e) {
      if (!player || !player.getDuration) return;
      const rect = progressTrack.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let pct = (clientX - rect.left) / rect.width;
      pct = Math.min(1, Math.max(0, pct));
      const duration = player.getDuration();
      player.seekTo(duration * pct, true);
      progressFill.style.width = pct * 100 + "%";
    }

    let isDragging = false;
    progressTrack.addEventListener("mousedown", (e) => { isDragging = true; seekFromEvent(e); });
    window.addEventListener("mousemove", (e) => { if (isDragging) seekFromEvent(e); });
    window.addEventListener("mouseup", () => { isDragging = false; });
    progressTrack.addEventListener("touchstart", (e) => { isDragging = true; seekFromEvent(e); });
    window.addEventListener("touchmove", (e) => { if (isDragging) seekFromEvent(e); });
    window.addEventListener("touchend", () => { isDragging = false; });

    playBtn.addEventListener("click", togglePlay);
    nextBtn.addEventListener("click", playNext);
    prevBtn.addEventListener("click", playPrev);
  </script>
</body>
</html>
